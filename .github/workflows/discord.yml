name: Discord notify

on:
  schedule:
    # 3:45pm EST (UTC-5) and 3:45pm EDT (UTC-4). The job no-ops unless
    # America/New_York is actually 15:45, so DST does not double-post.
    - cron: "45 19 * * *"
    - cron: "45 20 * * *"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pull-requests: read
  copilot-requests: write

jobs:
  daily-digest:
    name: Daily Wand Street Journal digest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Collect merged PRs
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          extra=()
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            extra+=(--schedule-cron "${{ github.event.schedule }}")
          fi
          python3 tools/discord_digest.py collect \
            --repo "${GITHUB_REPOSITORY}" \
            --briefing-path "${RUNNER_TEMP}/digest-briefing.md" \
            --prompt-path "${RUNNER_TEMP}/digest-prompt.txt" \
            --github-output "${GITHUB_OUTPUT}" \
            "${extra[@]}"

      - name: Skip empty or off-clock run
        if: steps.collect.outputs.skip == 'true'
        run: echo "No digest today."

      - name: Install Copilot CLI
        if: steps.collect.outputs.skip != 'true'
        run: npm install -g @github/copilot

      - name: Summarize for The Wand Street Journal
        if: steps.collect.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DIGEST_PROMPT="$(cat "${RUNNER_TEMP}/digest-prompt.txt")"
          copilot -p "$DIGEST_PROMPT" \
            --attachment "${RUNNER_TEMP}/digest-briefing.md" \
            --available-tools=view \
            --deny-tool=shell \
            --deny-tool=write \
            --deny-tool=url \
            --disable-builtin-mcps \
            --no-ask-user \
            --no-custom-instructions \
            --no-banner \
            --silent \
            --max-ai-credits=8 \
            --model=claude-haiku-4.5 \
            > "${RUNNER_TEMP}/digest-summary.md"

      - name: Post digest to Discord
        if: steps.collect.outputs.skip != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 tools/discord_digest.py post-digest \
            --date-label "${{ steps.collect.outputs.date_label }}" \
            --count "${{ steps.collect.outputs.count }}" \
            --summary-file "${RUNNER_TEMP}/digest-summary.md"

  special-edition:
    name: Wand Street Journal Special Edition
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Special Edition briefing
        id: prepare
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          python3 tools/discord_digest.py prepare-release \
            --briefing-path "${RUNNER_TEMP}/release-briefing.md" \
            --prompt-path "${RUNNER_TEMP}/release-prompt.txt" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Write Special Edition copy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_PROMPT="$(cat "${RUNNER_TEMP}/release-prompt.txt")"
          copilot -p "$RELEASE_PROMPT" \
            --attachment "${RUNNER_TEMP}/release-briefing.md" \
            --available-tools=view \
            --deny-tool=shell \
            --deny-tool=write \
            --deny-tool=url \
            --disable-builtin-mcps \
            --no-ask-user \
            --no-custom-instructions \
            --no-banner \
            --silent \
            --max-ai-credits=8 \
            --model=claude-haiku-4.5 \
            > "${RUNNER_TEMP}/release-summary.md"

      - name: Post Special Edition to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          python3 tools/discord_digest.py post-release \
            --summary-file "${RUNNER_TEMP}/release-summary.md"
