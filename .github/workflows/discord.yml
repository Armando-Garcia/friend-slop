name: Discord notify

on:
  schedule:
    # 3:45pm EST (UTC-5) and 3:45pm EDT (UTC-4). The job no-ops unless
    # America/New_York is actually 15:45, so DST does not double-post.
    - cron: "45 19 * * *"
    - cron: "45 20 * * *"
  workflow_dispatch:
    inputs:
      post_type:
        description: What to post for this manual test
        required: true
        type: choice
        default: digest
        options:
          - digest
          - special_edition
  release:
    types: [published]

permissions:
  contents: read
  pull-requests: read

jobs:
  daily-digest:
    name: Daily Wand Street Journal digest
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.post_type == 'digest')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Collect merged PRs
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          extra=()
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            extra+=(--schedule-cron "${{ github.event.schedule }}")
          fi
          python3 tools/discord_digest.py collect \
            --repo "${GITHUB_REPOSITORY}" \
            --briefing-path "${RUNNER_TEMP}/digest-briefing.md" \
            --prompt-path "${RUNNER_TEMP}/digest-prompt.txt" \
            --github-output "${GITHUB_OUTPUT}" \
            "${extra[@]}"

      - name: Skip empty or off-clock run
        if: steps.collect.outputs.skip == 'true'
        run: echo "No digest today."

      - name: Summarize for The Wand Street Journal
        if: steps.collect.outputs.skip != 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 tools/discord_summarize.py \
            --prompt-file "${RUNNER_TEMP}/digest-prompt.txt" \
            --briefing-file "${RUNNER_TEMP}/digest-briefing.md" \
            --output-file "${RUNNER_TEMP}/digest-summary.md"

      - name: Post digest to Discord
        if: steps.collect.outputs.skip != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 tools/discord_digest.py post-digest \
            --date-label "${{ steps.collect.outputs.date_label }}" \
            --count "${{ steps.collect.outputs.count }}" \
            --summary-file "${RUNNER_TEMP}/digest-summary.md"

  special-edition:
    name: Wand Street Journal Special Edition
    if: >
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.post_type == 'special_edition')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release fields
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            {
              echo "name<<EOF"
              echo "${RELEASE_NAME}"
              echo "EOF"
              echo "tag<<EOF"
              echo "${RELEASE_TAG}"
              echo "EOF"
              echo "url<<EOF"
              echo "${RELEASE_URL}"
              echo "EOF"
              echo "body<<EOF"
              echo "${RELEASE_BODY}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" || true)"
          if [[ -n "$latest" && "$latest" != "null" ]]; then
            name="$(printf '%s' "$latest" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("name") or "")')"
            tag="$(printf '%s' "$latest" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("tag_name") or "")')"
            url="$(printf '%s' "$latest" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("html_url") or "")')"
            body="$(printf '%s' "$latest" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("body") or "")')"
          else
            name="Manual Special Edition test"
            tag="manual-test"
            url="https://github.com/${GITHUB_REPOSITORY}/releases"
            body="This is a manual Actions test of The Wand Street Journal Special Edition path. No GitHub release was published."
          fi
          {
            echo "name<<EOF"
            printf '%s\n' "$name"
            echo "EOF"
            echo "tag<<EOF"
            printf '%s\n' "$tag"
            echo "EOF"
            echo "url<<EOF"
            printf '%s\n' "$url"
            echo "EOF"
            echo "body<<EOF"
            printf '%s\n' "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare Special Edition briefing
        id: prepare
        env:
          RELEASE_NAME: ${{ steps.release.outputs.name }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          RELEASE_BODY: ${{ steps.release.outputs.body }}
        run: |
          python3 tools/discord_digest.py prepare-release \
            --briefing-path "${RUNNER_TEMP}/release-briefing.md" \
            --prompt-path "${RUNNER_TEMP}/release-prompt.txt" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Write Special Edition copy
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 tools/discord_summarize.py \
            --prompt-file "${RUNNER_TEMP}/release-prompt.txt" \
            --briefing-file "${RUNNER_TEMP}/release-briefing.md" \
            --output-file "${RUNNER_TEMP}/release-summary.md"

      - name: Post Special Edition to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          python3 tools/discord_digest.py post-release \
            --summary-file "${RUNNER_TEMP}/release-summary.md"
